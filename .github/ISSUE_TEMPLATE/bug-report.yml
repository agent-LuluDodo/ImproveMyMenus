name: Bug Report
description: Report a bug
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: '# System'
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11
    validations:
      required: true
  - type: dropdown
    id: minecraft-version
    attributes:
      label: Minecraft Version
      options:
        - '26.1.2'
    validations:
      required: true
  - type: checkboxes
    id: up-to-date
    attributes:
      label: Checkboxes
      options:
        - label: Yes, my version of ImproveMyMenus is up-to-date
          required: true
        - label: No, this bug is not present without ImproveMyMenus
          required: true
  - type: markdown
    attributes:
      value: '# Information'
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true